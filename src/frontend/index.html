<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d6efd">
  <title>مستشفى أصدقاء المريض الخيري | بوابة المريض</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4 py-md-5">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <section class="login-card">
          <div class="hospital-logo">
            <div class="logo-image-wrap">
              <img class="logo-image" src="assets/images/logo.png" alt="شعار مستشفى أصدقاء المريض الخيري">
            </div>
            <div class="logo-text">
              <h1>مستشفى أصدقاء المريض الخيري</h1>
              <p>بوابة الخدمات الطبية الإلكترونية</p>
            </div>
          </div>

          <div class="welcome-section">
            <div class="welcome-icon" aria-hidden="true">
              <span>♙</span>
            </div>
            <h2>مرحبًا بك</h2>
            <p>أدخل رقم هويتك للوصول إلى ملفك، العيادات، الحجوزات، الفواتير ومتابعة الدور.</p>
          </div>

          <div id="loginAlert" class="alert d-none" role="alert"></div>

          <form id="loginForm" novalidate>
            <label for="nationalId" class="form-label">رقم الهوية</label>

            <div class="custom-input input-group">
              <span class="input-group-text" aria-hidden="true">ID</span>
              <input
                id="nationalId"
                class="form-control"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="9"
                placeholder="مثال: 123456789"
                aria-describedby="nationalIdHint"
                required
              >
            </div>

            <div id="nationalIdHint" class="form-text mt-2 mb-4">أدخل 9 أرقام بدون مسافات.</div>

            <button id="loginBtn" class="btn btn-primary continue-btn w-100" type="submit">
              <span id="loginText">متابعة</span>
              <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
            </button>
          </form>

          <div class="security-note">
            <span aria-hidden="true">●</span>
            <span>بياناتك تُستخدم للوصول إلى خدمات المريض فقط</span>
          </div>
        </section>

        <footer class="page-footer">نظام حجز وخدمات المرضى الإلكتروني</footer>
      </div>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
